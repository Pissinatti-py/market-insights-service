[project]
name = "market-insights-service"
version = "0.1.0"
description = "Tech-trends aggregator microservice — collects GitHub/PyPI/npm/article signals and curates them with an LLM."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.35",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.41",
    "psycopg2-binary==2.9.11",
    "asyncpg==0.31.0",
    "alembic==1.16.1",
    "python-dotenv>=1.1.0",
    "redis[hiredis]==6.2.0",
    "pytz",
    # Celery — periodic collectors + curation; redbeat-driven beat (Redis-backed).
    "celery[redis]==5.6.3",
    "celery-redbeat==2.3.3",
    # HTTP client for every external collector + the Ollama curation call.
    "httpx>=0.27",
    # RSS/Atom parsing for the Medium / technical-blog article collector.
    "feedparser>=6.0",
    # Main-content extraction from an article's full HTML page (curation enrichment).
    "trafilatura>=1.8",
    # Semver compare for "is this a major release?" in the package collector.
    "packaging>=24.0",
]

[dependency-groups]
dev = [
    "ruff==0.11.4",
    "pytest==8.3.5",
    "pytest-asyncio==0.23.6",
    "httpx>=0.28.1",
    "pytest-cov==5.0.0",
    "respx>=0.21",
    "ipython==9.2.0",
]

[tool.uv]
# Application, not a distributable library — uv only manages the dependency set;
# the code is imported via PYTHONPATH=/app (see Dockerfile), not pip-installed.
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
    "src/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line-too-long is enforced by the formatter, not the linter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/migrations/*"]
